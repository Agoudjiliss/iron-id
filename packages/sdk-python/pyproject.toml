[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ironid"
version = "1.0.0"
description = "Official Python SDK for IronID — C2PA-powered content provenance."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "IronID", email = "sdk@ironid.io" }]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
]
keywords = ["c2pa", "content-authenticity", "digital-provenance", "ironid"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage    = "https://ironid.io"
Repository  = "https://github.com/ironid/ironid-python"
Issues      = "https://github.com/ironid/ironid-python/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ironid*"]
