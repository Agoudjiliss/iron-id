version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: ironid_postgres
    environment:
      POSTGRES_DB: ironid
      POSTGRES_USER: ironid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ironid_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironid -d ironid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ironid_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-ironid_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-ironid_redis_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ironid_api
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ironid_celery
    env_file: ../.env
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=4

  web:
    image: node:20-alpine
    container_name: ironid_web
    working_dir: /app
    env_file: ./apps/web/.env.local
    environment:
      INTERNAL_API_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  redis_data:
