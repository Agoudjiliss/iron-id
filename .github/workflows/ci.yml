name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---- Python API tests ----
  api-test:
    name: API — pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_DB: ironid_test
          POSTGRES_USER: ironid
          POSTGRES_PASSWORD: ironid_test
        options: >-
          --health-cmd "pg_isready -U ironid -d ironid_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run unit tests (fast, no API server needed)
        env:
          DATABASE_URL: postgresql+asyncpg://ironid:ironid_test@localhost:5432/ironid_test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          APP_SECRET_KEY: test_secret_key_for_ci_only
          CLERK_SECRET_KEY: sk_test_placeholder
          CLERK_WEBHOOK_SECRET: whsec_placeholder
          PAYPAL_CLIENT_ID: placeholder
          PAYPAL_CLIENT_SECRET: placeholder
          PAYPAL_WEBHOOK_ID: placeholder
          PAYPAL_MODE: sandbox
          R2_ACCOUNT_ID: placeholder
          R2_ACCESS_KEY_ID: placeholder
          R2_SECRET_ACCESS_KEY: placeholder
          R2_BUCKET_NAME: ironid-test
          R2_PUBLIC_URL: https://r2.ironid.io
          FRONTEND_URL: http://localhost:3000
          CORS_ORIGINS: http://localhost:3000
        run: |
          pytest tests/test_c2pa_service.py \
                 tests/test_file_service.py \
                 tests/test_api_key_service.py \
                 tests/test_paypal_service.py \
                 -v --tb=short

  # ---- TypeScript type-check ----
  web-typecheck:
    name: Web — tsc
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  # ---- SDK JS type-check ----
  sdk-js-typecheck:
    name: SDK JS — tsc
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/sdk-js

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/sdk-js/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

  # ---- Docker build smoke test ----
  docker-build:
    name: Docker — build API image
    runs-on: ubuntu-latest
    needs: [api-test]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: false
          tags: ironid/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
